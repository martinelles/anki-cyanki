services:
  sveltekit:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    env_file:
      - ./frontend/.env.production
    restart: unless-stopped
    depends_on:
      - backend

  frontend:
    image: nginx:alpine
    ports:
      # so no loopback: o tunel nao passa por aqui, alcanca o servico pela
      # rede interna do compose
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - sveltekit
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:8080:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME_PROD}
      - ENVIRONMENT=production
    restart: unless-stopped
    depends_on:
      # Esperar o container subir não basta: o create_all do lifespan roda uma vez
      # e, se o Postgres ainda não aceita conexão, a exceção é engolida e a API
      # sobe sem tabela nenhuma. Mesmo motivo do docker-compose.yml.
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME_PROD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME_PROD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    env_file:
      - .env
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

volumes:
  postgres_data_prod:
